version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: dms_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: dms_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Redis Message Broker
  redis:
    image: redis:7-alpine
    container_name: dms_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: dms_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # 3.1 MinIO Bucket Auto-Creator
  createbuckets:
    image: minio/mc:latest
    container_name: dms_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/dms-documents;
      /usr/bin/mc anonymous set download local/dms-documents;
      exit 0;
      "

  # 4. FastAPI Backend API (Mount โฟลเดอร์สแกนเนอร์ scanner_inbox)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dms_backend
    restart: always
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/dms_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: dms-documents
      MINIO_SECURE: "false"
    volumes:
      - ./scanner_inbox:/app/scanner_inbox
    ports:
      - "8000:8000"

  # 5. Celery OCR Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dms_celery_worker
    restart: always
    command: celery -A app.workers.ocr_worker.celery_app worker --loglevel=info
    depends_on:
      - backend
      - redis
      - postgres
      - minio
    environment:
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/dms_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: dms-documents
      MINIO_SECURE: "false"

  # 6. React Frontend Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dms_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  miniodata: