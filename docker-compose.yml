services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: dms_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-dms_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dms_network

  # 2. Redis Message Broker
  redis:
    image: redis:7-alpine
    container_name: dms_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - dms_network

  # 3. Object Storage (MinIO)
  minio:
    image: minio/minio:latest
    container_name: dms_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - dms_network

  # 4. Backend (FastAPI API Server)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dms_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-dms_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-dms_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_default}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      # GitHub OAuth Config (Local)
      GITHUB_CLIENT_ID: "Ov23liLfDAG5oh8JAw9k"
      GITHUB_CLIENT_SECRET: "d833d3490bed807e7207b7ba14b311da224e2886"
      GITHUB_REDIRECT_URI: "http://localhost:8000/api/auth/github/callback"
      GITHUB_ADMIN_EMAILS: "1166109051019@mail.rmutt.ac.th"
      GITHUB_ALLOWED_EMAILS: "1166109051019@mail.rmutt.ac.th"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - dms_network

  # 5. Worker (Celery OCR Processor)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dms_worker
    restart: always
    command: celery -A app.workers.ocr_worker worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-dms_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-dms_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - dms_network

  # 6. Frontend (React / Nginx Web Client)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dms_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dms_network

volumes:
  pgdata:
  minio_data:

networks:
  dms_network:
    driver: bridge